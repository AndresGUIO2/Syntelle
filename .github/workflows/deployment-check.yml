name: Deployment checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      - run: python3 deploy.py check
  application:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: offline-ci-fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: 1.27.2
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - run: go test ./... -count=1 -timeout 90s
        working-directory: services/api
      - run: go test -race -tags integration ./internal/streaming -count=1 -timeout 90s
        working-directory: services/api
        env:
          SYNTELLE_STREAMING_TEST_DATABASE_URL: postgresql://postgres:offline-ci-fixture@127.0.0.1:5432/postgres?sslmode=disable
      - run: go test ./cmd/render-worker ./internal/nativemedia -count=1 -timeout 90s
        working-directory: services/render-worker
      - run: go test ./... -count=1
        working-directory: packages/render-contract
      - run: python3 -m pip install uv==0.9.16
      - run: uv run --frozen pytest -q tests/test_cloud_auth.py
        working-directory: services/processor
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npx --prefix apps/web playwright test --config deploy/browser.playwright.config.ts
