name: Deploy Syntelle
on:
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        options: [foundation, services, all]
        required: true
permissions:
  contents: read
concurrency:
  group: syntelle-deployment
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - run: python3 -m pip install uv==0.9.16
      - run: npm --prefix apps/web ci
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false
      - name: Materialize private deployment configuration
        env:
          CONFIG: ${{ secrets.SYNTELLE_DEPLOY_CONFIG }}
        run: |
          mkdir -p .deploy-private
          printf '%s' "$CONFIG" > .deploy-private/config.json
          chmod 600 .deploy-private/config.json
      - name: Retrieve approved private renderer export
        if: inputs.stack == 'all'
        run: python3 -m deploy.artifacts
        env:
          BUNDLE_URL: ${{ secrets.SYNTELLE_RENDER_BUNDLE_URL }}
          BUNDLE_SHA256: ${{ secrets.SYNTELLE_RENDER_BUNDLE_SHA256 }}
      - uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: python3 deploy.py apply --stack "${{ inputs.stack }}"
        env:
          ARM_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
